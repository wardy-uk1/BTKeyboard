name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew --no-daemon assembleRelease
      - name: Prepare APK and release notes
        id: meta
        run: |
          cp app/build/outputs/apk/release/app-release.apk BTKeyboard.apk
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Pull this version's entry from the "What's new" section of the README.
          awk -v v="### v$VERSION" '
            index($0, v) == 1 { on = 1; next }
            on && /^##/ { exit }
            on { print }
          ' README.md > notes.md
          [ -s notes.md ] || echo "Build of v$VERSION." > notes.md
          cat notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: BTKeyboard-apk
          path: BTKeyboard.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: v${{ steps.meta.outputs.version }}
          body_path: notes.md
          make_latest: true
          files: BTKeyboard.apk
